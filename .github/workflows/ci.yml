name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test:
    name: Check + test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        # Warnings don't fail the build (can't gate what can't run on every
        # host); errors still do. Promote to `-D warnings` once clean.
        run: cargo clippy --all-targets

      - name: Unit tests
        run: cargo test --locked

      - name: Release check-build
        run: cargo check --locked --release
